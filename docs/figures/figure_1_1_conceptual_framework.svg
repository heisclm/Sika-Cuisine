<text x="1480" y="1147.0" font-size="14.5" fill="#475569" text-anchor="middle">Customer receives hot meal in Sunyani</text>
<line x1="1480" y1="1172" x2="1480" y2="1242" stroke="#334155" stroke-width="3" marker-end="url(#arr)" />
<rect x="1290.0" y="1242.0" width="380" height="56" rx="28.0" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
<text x="1480" y="1276" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">COMPLETED (Ledger Settled)</text>
<rect x="60" y="1800" width="1680" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
<text x="90" y="1836" font-size="20" font-weight="bold" fill="#0f172a">COMPUTATIONAL &amp; ARCHITECTURAL HIGHLIGHTS (ACADEMIC SPECIFICATION)</text>
<rect x="90" y="1860" width="490" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
<text x="100" y="1882" font-size="15" font-weight="bold" fill="#1e3a8a">Zero Floating-Point Financial Precision:</text>
<text x="95" y="1914" font-size="14" fill="#475569">All prices, delivery fees, and subtotals computed strictly as integer pesewas (1 GHS = 100 pesewas) to eliminate accumulated rounding drift.</text>
<rect x="90" y="1940" width="490" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
<text x="100" y="1962" font-size="15" font-weight="bold" fill="#1e3a8a">Server-Authoritative Pricing Model:</text>
<text x="95" y="1994" font-size="14" fill="#475569">Client-submitted monetary amounts are strictly discarded at checkout. The server re-evaluates all values from PostgreSQL database snapshots.</text>
<rect x="90" y="2020" width="490" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
<text x="100" y="2042" font-size="15" font-weight="bold" fill="#1e3a8a">Cryptographically Verified Webhooks:</text>
<text x="95" y="2074" font-size="14" fill="#475569">Paystack payment signals verified using HMAC SHA512 signatures with timing-safe string comparison, preventing payment spoofing.</text>
<rect x="90" y="2100" width="490" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
<text x="100" y="2122" font-size="15" font-weight="bold" fill="#1e3a8a">Sunyani Locality Delivery Matrix:</text>
<text x="95" y="2154" font-size="14" fill="#475569">Pre-computed delivery tariffs for Sunyani Central, Fiapre (UENR/CUG), Berlin Top, Penkwase, Abesim, New Dormaa, and Airport Residential.</text>
<rect x="90" y="2180" width="490" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
<text x="100" y="2202" font-size="15" font-weight="bold" fill="#1e3a8a">Strict Fulfilment State Machine:</text>
<text x="95" y="2234" font-size="14" fill="#475569">Rigid state transitions (PENDING_CONFIRMATION -> CONFIRMED -> PREPARING -> OUT_FOR_DELIVERY -> COMPLETED) preventing illegal jumps.</text>
<text x="900.0" y="2325" font-size="15" font-style="italic" fill="#64748b" text-anchor="middle">* Catholic University of Ghana, Faculty of Computing, Engineering &amp; Mathematical Sciences (CEMS)</text>
</svg>
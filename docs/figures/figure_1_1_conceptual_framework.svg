<line x1="1590" y1="817" x2="1595" y2="905" stroke="#334155" stroke-width="3" marker-end="url(#arr)" />
<rect x="1600.5" y="849.0" width="72" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

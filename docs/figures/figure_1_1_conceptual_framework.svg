<text x="1375" y="956.0" font-size="14.5" fill="#475569" text-anchor="middle">Courier dispatched</text>
<text x="1375" y="978.0" font-size="14.5" fill="#475569" text-anchor="middle">to Sunyani locality</text>
<rect x="1490.0" y="905.0" width="210" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
<text x="1595" y="932.0" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">READY_COLLECTION</text>
<text x="1595" y="956.0" font-size="14.5" fill="#475569" text-anchor="middle">Staged at counter</text>
<text x="1595" y="978.0" font-size="14.5" fill="#475569" text-anchor="middle">Customer notified</text>
<path d="M 1375 995 L 1375 1055 L 1380 1087" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr)" />
